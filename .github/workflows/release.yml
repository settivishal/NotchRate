name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build app bundle
        run: |
          swift build -c release
          mkdir -p NotchRate.app/Contents/MacOS
          cp .build/release/NotchRate NotchRate.app/Contents/MacOS/
          cp Info.plist NotchRate.app/Contents/
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${GITHUB_REF_NAME#v}" NotchRate.app/Contents/Info.plist || true
          codesign --force --sign - NotchRate.app
          ditto -c -k --keepParent NotchRate.app NotchRate-${GITHUB_REF_NAME}.zip
          shasum -a 256 NotchRate-${GITHUB_REF_NAME}.zip > NotchRate-${GITHUB_REF_NAME}.zip.sha256
      - name: Attach to release
        run: gh release upload "$GITHUB_REF_NAME" NotchRate-${GITHUB_REF_NAME}.zip NotchRate-${GITHUB_REF_NAME}.zip.sha256 --clobber || gh release create "$GITHUB_REF_NAME" NotchRate-${GITHUB_REF_NAME}.zip NotchRate-${GITHUB_REF_NAME}.zip.sha256 --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
